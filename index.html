<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Embedded Viewer</title>
    <link rel="stylesheet" href="style.css">

    <!-- Favicon SVG incorporata -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23FF0000' rx='15'/><polygon points='35,25 35,75 75,50' fill='%23FFFFFF'/></svg>">
</head>
<body>
    <div class="container">
        <div class="video-wrapper" id="videoWrapper">
            <p class="no-video">Nessun video caricato</p>
        </div>
        <div class="info" id="info"></div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>Per informazioni sulla privacy, consultare la <a href="https://www.youtube.com/about/policies/privacy/" target="_blank" rel="noopener noreferrer">Privacy Policy di YouTube</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
